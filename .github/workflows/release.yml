name: Release

# Trigger on version tags: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14           # Apple Silicon
            target: aarch64-apple-darwin
            sidecar_name: sidecar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_name: sidecar.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecar_name: sidecar

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # ── Node / pnpm ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # ── Python + PyInstaller sidecar ─────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies for sidecar
        run: |
          pip install --upgrade pip
          pip install pyinstaller pyimzml numpy fastapi uvicorn anyio

      - name: Build PyInstaller sidecar
        run: |
          pyinstaller app/sidecar/sidecar.spec --distpath app/sidecar/dist --workpath /tmp/pyinstaller_work
        shell: bash

      - name: Copy sidecar binary to sidecar directory
        run: |
          cp app/sidecar/dist/${{ matrix.sidecar_name }} app/sidecar/${{ matrix.sidecar_name }}
        shell: bash

      # Add the compiled binary to Tauri resources so it gets bundled into the app.
      # We modify tauri.conf.json in-place; this only affects the CI checkout.
      - name: Register sidecar binary in Tauri resources (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          jq --arg name "${{ matrix.sidecar_name }}" \
            '.bundle.resources["../sidecar/" + $name] = ("sidecar/" + $name)' \
            app/src-tauri/tauri.conf.json > /tmp/tauri_conf_tmp.json
          mv /tmp/tauri_conf_tmp.json app/src-tauri/tauri.conf.json

      - name: Register sidecar binary in Tauri resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.resources | Add-Member -NotePropertyName '../sidecar/sidecar.exe' `
            -NotePropertyValue 'sidecar/sidecar.exe' -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content app/src-tauri/tauri.conf.json

      # ── Linux system dependencies ────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # ── Frontend + Tauri build ───────────────────────────────────────────────
      - name: Install frontend dependencies
        run: cd app && pnpm install

      - name: Build Tauri application
        run: cd app && pnpm tauri build -- --features pyinstaller-sidecar
        env:
          # PRASZCZUR_ROOT is only read by build.rs for local dev (non-pyinstaller builds).
          # Set to workspace root so build.rs does not error; the runtime value is
          # app_data_dir() when pyinstaller-sidecar feature is active.
          PRASZCZUR_ROOT: ${{ github.workspace }}

      # ── Upload release artifacts ─────────────────────────────────────────────
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/src-tauri/target/release/bundle/macos/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

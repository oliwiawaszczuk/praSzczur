[project]
name = "praSzczur"
version = "0.1.0"
description = "MALDI-MSI rat brain analysis"
requires-python = ">=3.11"
dependencies = [
    "pyimzml>=1.5.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pillow>=10.0",
    "tqdm>=4.66",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyinstaller>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/msi"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
